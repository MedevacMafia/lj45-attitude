<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#080c12">
<title>LJ45 Attitude · By Spiros Konstas</title>
<meta name="description" content="Independent Learjet 45-inspired artificial horizon, compass and GPS simulator. By Spiros Konstas. Not for flight use.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LJ45 Attitude">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
<link rel="manifest" href="./manifest.webmanifest">
<style>
:root { color-scheme: dark; --bg:#070b10; --panel:#151c24; --line:#394451; --text:#e5edf6; --muted:#99a8ba; --cyan:#76dced; --green:#9de385; --amber:#ffd35a; }
* { box-sizing:border-box }
html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; overscroll-behavior:none }
body { min-height:100svh; -webkit-user-select:none; user-select:none; }
main { height:100svh; display:flex; flex-direction:column; gap:8px; max-width:1100px; margin:auto; padding:max(9px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom)); }
header { min-height:30px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.brand { display:flex; align-items:baseline; gap:9px; white-space:nowrap; }
.brand strong { color:white; font-size:15px; letter-spacing:.11em; font-weight:800; }
.brand small { font-size:10px; color:#9daabd; letter-spacing:.1em; }
.status { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:10px; font-weight:750; letter-spacing:.06em; text-align:right; }
.dot { height:8px; width:8px; background:#e0ac50; border-radius:50%; flex:none; box-shadow:0 0 9px #e0ac5060; }
.status.active .dot { background:#62dc90; box-shadow:0 0 9px #62dc9080; }
#bezel { position:relative; flex:1; min-height:0; overflow:hidden; border:1px solid #59636c; border-radius:13px; padding:7px; background:linear-gradient(125deg,#34414f,#131920 12%,#090c12 60%,#303c48); box-shadow:0 8px 30px #000b,inset 0 1px 0 #71819166; }
#display { display:block; width:100%; height:100%; background:#020406; border:1px solid #1a262e; border-radius:4px; touch-action:none; }
.corner { position:absolute; width:7px; height:7px; border-radius:50%; background:#111b25; box-shadow:inset 0 0 0 1px #657181; pointer-events:none }
.tl{top:2px;left:2px}.tr{top:2px;right:2px}.bl{bottom:2px;left:2px}.br{bottom:2px;right:2px}
#panel { display:flex; flex-direction:column; gap:7px; flex:none; }
.actions { display:grid; grid-template-columns:1.1fr 1.05fr .95fr .85fr .85fr .75fr; gap:6px; }
#alertBar { display:flex; flex-wrap:wrap; gap:7px; align-items:center; background:#1c1520; padding:5px 7px; border:1px solid #534250; border-radius:7px; min-height:35px; }
#bankAudio { min-width:96px; padding:7px 5px; border-color:#967048; color:#ffe0ae; }
#bankAudio.selected { background:#4b3123; border-color:#f5a75f; color:#fff1cd; }
#testBankAudio { min-width:85px; padding:7px 5px; color:#c7f7e2; border-color:#54867b; }
#wakeBtn {min-width:70px; padding:7px 5px; color:#b6ebf6; border-color:#4e8591;}
#bankNotice { flex:1 1 100%; font-size:10px; font-weight:750; color:#d8bfa7; line-height:1.3; }
#alertBar.warning { background:#4e1b20; border-color:#fe8265; }
#alertBar.warning #bankNotice { color:#ffe1c6; }
#altBar, #speedBar { display:flex; gap:7px; align-items:center; background:#101c27; padding:5px 7px; border:1px solid #335466; border-radius:7px; min-height:35px; }
#altMode, #speedMode { min-width:104px; padding:7px 5px; border-color:#55768b; color:#a2edf9; }
#altMode.selected, #speedMode.selected { background:#184252; border-color:#67d2e8; color:#d0f8ff; }
#gpsInfo, #speedInfo { font-size:10px; font-weight:750; color:#a8c5d5; overflow-wrap:anywhere; line-height:1.3; font-variant-numeric:tabular-nums; }
button { border-radius:7px; border:1px solid #405061; background:linear-gradient(#263441,#141e29); color:#e9f1f8; padding:11px 5px; font-size:11px; line-height:1.1; font-weight:800; letter-spacing:.025em; cursor:pointer; min-width:0; user-select:none; -webkit-tap-highlight-color:transparent }
button:active { transform:translateY(1px); background:#3c5568; }
button.selected { background:#173e4c; border-color:#65becf; color:#b9f5ff; }
button:focus-visible {outline:2px solid var(--cyan);outline-offset:2px}
#hint {font-size:11px;color:#b0becb;line-height:1.35;margin:0;text-align:center;min-height:15px}
#sensorInfo, #compassInfo {font-size:10px;line-height:1.25;color:#96d2e3;background:#091825;border:1px solid #2c4659;border-radius:5px;margin:0;padding:5px 7px;text-align:center;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;}
#manual { display:none; grid-template-columns:1fr 1fr; column-gap:18px; padding:4px 4px 0; }
#manual.visible { display:grid }
.control { display:flex; flex-direction:column; gap:3px; }
.control label { display:flex; justify-content:space-between; font-size:10px; font-weight:750; letter-spacing:.07em; color:#b6c4d2; }
.control output { color:var(--amber); font-variant-numeric:tabular-nums; }
input[type=range] { width:100%; accent-color:#e5b74d; margin:4px 0; height:15px }
footer { text-align:center; font-size:9px; color:#788b9c; letter-spacing:.035em; }
footer .credit { font-size:11px; color:#b9cedb; font-weight:700; letter-spacing:.06em; margin-bottom:3px; }
@media (orientation:landscape) and (max-height:550px) {
  main { flex-direction:row; padding:5px max(5px,env(safe-area-inset-right)) 5px max(5px,env(safe-area-inset-left)); gap:5px; max-width:none; }
  header { position:absolute; z-index:2; top:10px; left:auto; right:153px; pointer-events:none; }
  header .brand { display:none }
  #bezel { flex:1; min-width:0; }
  #panel { width:130px; min-width:130px; gap:4px; justify-content:center; }
  .actions { grid-template-columns:1fr 1fr; gap:5px }
  button {font-size:10px;padding:7px 3px}
  #full {grid-column:auto}
  #alertBar {flex-direction:column; align-items:stretch; padding:4px; gap:2px; min-height:0}
  #bankAudio, #testBankAudio, #wakeBtn { min-width:0; padding:6px 3px}
  #bankNotice {font-size:9px; text-align:center}
  #altBar, #speedBar {flex-direction:column; align-items:stretch; padding:4px; gap:2px; min-height:0}
  #altMode, #speedMode {min-width:0; padding:6px 3px}
  #gpsInfo, #speedInfo {font-size:9px; text-align:center}
  #hint {font-size:9px; line-height:1.2; max-height:25px; overflow:hidden}
  #manual.visible {grid-template-columns:1fr;row-gap:5px}
  #sensorInfo {font-size:8px; max-height:30px; padding:4px; overflow:hidden; line-height:1.15}
  footer {font-size:8px}
  footer .credit {font-size:10px; margin-bottom:5px}
}
/* On small portrait iPhones, preserve enough height for the horizon + heading rose.
   Controls stay fully available in their own scrollable area. */
@media (orientation:portrait) and (max-height:740px) {
  #panel { max-height:47svh; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; padding-bottom:5px; }
  #bezel { min-height:180px; }
  #sensorInfo, #compassInfo { font-size:9px; }
}
@media (max-width:390px) { .brand small{display:none} }
@media (max-width:365px) { .brand strong{font-size:12px}.brand small{font-size:8px}.status{font-size:9px} button{font-size:10px} }

/* Compact controls: maximize the instrument area. */
main {gap:4px;padding:max(4px,env(safe-area-inset-top)) 5px max(4px,env(safe-area-inset-bottom));}
header {min-height:23px;}
#bezel {padding:3px;}
#panel {gap:3px;max-height:none;overflow:visible;padding:0;}
.actions {grid-template-columns:repeat(6,minmax(0,1fr));gap:3px;}
/* Portrait: keep every button inside its equal-width grid cell, including GPS controls. */
.actions {width:100%;min-width:0;}
.actions button, .actions #altMode, .actions #speedMode {
  width:100%;min-width:0;max-width:100%;padding:7px 1px;
  font-size:clamp(8px,2.4vw,10px);letter-spacing:0;line-height:1.1;
  min-height:35px;white-space:normal;overflow-wrap:normal;
}
#panel {width:100%;min-width:0;}
#alertBar {display:none;min-height:0;padding:2px 4px;justify-content:center;}
#alertBar.warning {display:flex;}
#bankNotice {text-align:center;font-size:9px;}
#diagnostics[hidden] {display:none!important;}
footer {font-size:8px;line-height:1.1;}
@media (orientation:landscape) and (max-height:550px) {
 main {flex-direction:column;gap:3px;}
 header {position:static;min-height:15px;justify-content:flex-end;}
 #panel {width:100%;min-width:0;}
 #bezel {min-height:0;}
 .actions {grid-template-columns:repeat(6,minmax(0,1fr));}
 .actions button {min-height:28px;padding:4px 2px;}
}
</style>
</head>
<body>
<main>
<header>
  <div class="brand"><strong>LEARJET 45</strong><small>PRIMUS 1000 · ATTITUDE</small></div>
  <div class="status" id="status"><span class="dot"></span><span id="statusText">MOTION WAITING</span></div>
</header>
<section id="bezel" aria-label="Learjet 45-inspired artificial horizon display">
  <canvas id="display" aria-label="Artificial horizon with pitch and bank indications"></canvas>
  <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
</section>
<section id="panel">
  <div class="actions">
    <button id="motion" class="selected" type="button" title="Attempt access to phone orientation sensors">SENSORS</button>
    <button id="level" type="button" title="Reset artificial horizon to level">LEVEL</button>
    <button id="zero" type="button" title="Set the current phone position as straight and level">ZERO</button>
    <button id="bankReverse" type="button" aria-pressed="false" title="Reverse left and right bank indications only">BANK: NORM</button>
    <button id="altMode" type="button" aria-pressed="false" title="Switch altitude between simulated and the phone's satellite GPS">ALT: SIM</button>
    <button id="speedMode" type="button" aria-pressed="false" title="Switch left tape between simulated airspeed and live GPS ground speed">SPD: SIM</button>
  </div>
  <div id="alertBar" aria-live="polite"><span id="bankNotice"></span></div>
  <div id="diagnostics" hidden><span id="gpsInfo"></span><span id="speedInfo"></span><p id="hint"></p><p id="sensorInfo"></p><p id="compassInfo"></p><span id="wakeBtn"></span></div>
  <footer>By Spiros Konstas · v1.6.2 · NOT FOR FLIGHT OR NAVIGATION · <a href="./privacy.html" style="color:#9ad3e0">Privacy</a></footer>
</section>
</main>
<script>
(() => {
  'use strict';
  const ANDROID_NATIVE_APP = false;
  const canvas = document.getElementById('display');
  const audio = new Audio('./bank_warning.mp3');
  audio.preload = 'auto'; audio.loop = true;
  
  let wakeLock = null, wakeRequested = true, positionWatch = null;
  let lastLocation = null;
  let motionAllowed = false;
  const ctx = canvas.getContext('2d',{ alpha:false });
  const el = id => document.getElementById(id);
  const rad = Math.PI / 180;
  const clamp = (x,a,b) => Math.max(a,Math.min(b,x));
  const wrap = x => ((x+180)%360+360)%360-180;
  const state = {
    bankReversed:false, mode:'motion', sensorSeen:false, lastSensor:0, source:'', bank:0, pitch:0, orientationEvents:0, motionEvents:0,
    targetBank:0,targetPitch:0,rawBank:0,rawPitch:0,zeroBank:0,zeroPitch:0,
    manualBank:0,manualPitch:0, pressed:false,dragX:0,dragY:0,
    altMode:'sim', gpsAltitudeFeet:null, gpsDisplayFeet:null, gpsDatum:'WGS84', gpsAccuracyFeet:null, gpsLastFixAt:0, gpsStatus:'GPS OFF', speedMode:'sim', gpsSpeedKnots:null, gpsSpeedDisplayKnots:null, gpsSpeedAccuracyKnots:null, gpsSpeedLastFixAt:0, gpsSpeedStatus:'GPS OFF', heading:null, headingSource:'NO HEADING', bankAudioEnabled:true, bankAudioPlaying:false, bankAudioStatus:'TAP SENSORS TO ARM', pitchReverse:true
  };
  function displayBank() { return state.bankReversed ? -state.bank : state.bank; }
  try { state.bankReversed=localStorage.getItem('lj45BankReverse')==='true'; } catch(e) {}
  function updateBankReverseButton(){
    const b=el('bankReverse');
    b.textContent=state.bankReversed?'BANK: REV':'BANK: NORM';
    b.classList.toggle('selected',state.bankReversed);
    b.setAttribute('aria-pressed',String(state.bankReversed));
  }
  updateBankReverseButton();
  el('bankReverse').addEventListener('click',()=>{
    state.bankReversed=!state.bankReversed;
    try {localStorage.setItem('lj45BankReverse',String(state.bankReversed));}catch(e){}
    updateBankReverseButton();
  });
  function setStatus(message,active=false) {
    el('statusText').textContent=message;
    el('status').classList.toggle('active',active);
  }
  function hint(message) {el('hint').textContent=message;}
  const route=ANDROID_NATIVE_APP?'ANDROID APK':location.protocol==='content:'?'ANDROID CONTENT FILE':location.protocol==='file:'?'LOCAL FILE':location.protocol==='https:'?'HTTPS':location.protocol.replace(':','').toUpperCase();
  let absoluteHeadingEvents=0;
  let lastAbsoluteHeadingAt=0;
  let lastHeadingAt=0;
  let lastCompassAt=0;
  let relativeOrientationEvents=0;
  const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  let compassAccuracy=null;
  let compassPermission='TAP SENSORS';
  let safariCompassEvents=0;
  let invalidCompassEvents=0;
  let genericCompassSensor=null;
  let genericSensorStatus='NOT STARTED';
  let genericSensorReadings=0;
  let latestGenericReadingAt=0;

  function updateDiagnostics(){
    const live=state.sensorSeen && performance.now()-state.lastSensor<2000;
    const measured=live?'LIVE '+state.source.toUpperCase()+' | BANK '+state.rawBank.toFixed(1)+'° / PITCH '+state.rawPitch.toFixed(1)+'°':'NO LIVE SENSOR READINGS';
    el('sensorInfo').textContent='SENSOR: '+measured+'  |  EVENTS O:'+state.orientationEvents+' M:'+state.motionEvents+'  |  '+route+'  |  SECURE: '+(window.isSecureContext?'YES':'NO');
    const compassFresh=Number.isFinite(state.heading) && performance.now()-lastHeadingAt<7000;
    if (!compassFresh && state.headingSource!=='NO HEADING') {
      state.heading=null;
      state.headingSource='NO HEADING';
      compassAccuracy=null;
    }
    if (compassFresh) {
      const accuracy=(Number.isFinite(compassAccuracy) && state.headingSource==='iPHONE MAG')
        ? ' · ±'+Math.round(compassAccuracy)+'°' : '';
      el('compassInfo').textContent='COMPASS: '+Math.round(state.heading).toString().padStart(3,'0')+'°  '+state.headingSource+accuracy;
    } else if (isIOS) {
      const reason=compassPermission==='DENIED'?'Permission denied: enable Motion & Orientation in Safari, then retry.'
        : invalidCompassEvents>0?'Uncalibrated compass; move phone away from magnets and rotate it.'
        : state.orientationEvents>0?'Motion active, but iPhone has not supplied a magnetic heading.'
        : 'Tap SENSORS in Safari and Allow Motion & Orientation.';
      el('compassInfo').textContent='COMPASS: --- · '+reason;
    } else {
      el('compassInfo').textContent= 'COMPASS: --- · '+
        (genericSensorStatus!=='NOT STARTED'? 'MAG SENSOR '+genericSensorStatus+' · '+genericSensorReadings+' reads'
          : state.orientationEvents>0?'No north-referenced heading. Tap SENSORS to try Chrome compass.'
          : 'Tap SENSORS to request compass readings.');
    }
    if(state.mode==='motion'&&state.sensorSeen&&!live){setStatus('SENSOR SIGNAL LOST');}
  }

  // Bank alarm: on above 35°, off below 32° to avoid repeated switching near the boundary.
  // Native Android SoundPool plays the short recording while the app is foregrounded.
  function setNativeBankSound(active) {
    if (active) {
      audio.loop = true;
      audio.currentTime = 0;
      const pending = audio.play();
      if (pending && typeof pending.catch === 'function') {
        pending.then(() => { state.bankAudioStatus='ALERT PLAYING'; }).catch(() => {
          state.bankAudioStatus='TAP SENSORS TO UNLOCK AUDIO';
        });
      }
    } else {
      audio.pause();
      audio.currentTime = 0;
      if (state.bankAudioStatus==='ALERT PLAYING') state.bankAudioStatus='AUDIO READY';
    }
  }
  function refreshBankSound() {
    const degrees=Math.abs(state.bank);
    if(document.hidden) return;
    if (!state.bankAudioEnabled) {
      if(state.bankAudioPlaying) { state.bankAudioPlaying=false; setNativeBankSound(false); }
    } else if (!state.bankAudioPlaying && degrees>35) {
      state.bankAudioPlaying=true;
      setNativeBankSound(true);
    } else if (state.bankAudioPlaying && degrees<32) {
      state.bankAudioPlaying=false;
      setNativeBankSound(false);
    }
    const warning=state.bankAudioPlaying;
    el('alertBar').classList.toggle('warning',warning);
    el('bankNotice').textContent=warning?'BANK '+Math.round(degrees)+'° · '+state.bankAudioStatus:'';
  }
  window.receiveNativeBankAudioStatus = message => {
    state.bankAudioStatus = String(message||'AUDIO UNKNOWN').slice(0,90);
    // The warning bar is also refreshed by render().
  };
  // Unlock the existing audio element from the SENSORS gesture, without a test button.
  function armAudio(){
    if(state.bankAudioPlaying){setNativeBankSound(true);return;}
    audio.muted=true;
    try {
      const pending=audio.play();
      Promise.resolve(pending).then(()=>{
        if(!state.bankAudioPlaying){audio.pause();audio.currentTime=0;}
        audio.muted=false;state.bankAudioStatus='AUDIO READY';
      }).catch(()=>{audio.muted=false;state.bankAudioStatus='AUDIO BLOCKED · TAP SENSORS';});
    }catch(e){audio.muted=false;state.bankAudioStatus='AUDIO BLOCKED · TAP SENSORS';}
  }
  setInterval(updateDiagnostics,700);
  const SIM_ALT_FT = 4300;
  const SIM_IAS_KT = 240;
  const KNOTS_PER_MPS = 1.943844492;
  const FT_PER_M = 3.280839895;
  const GPS_STALE_MS = 12000;
  function gpsFresh() {
    return state.altMode==='live' && Number.isFinite(state.gpsAltitudeFeet) &&
      performance.now()-state.gpsLastFixAt<GPS_STALE_MS;
  }
  function currentAltitude() {
    return state.altMode==='sim'?SIM_ALT_FT:gpsFresh()?state.gpsDisplayFeet:null;
  }
  function speedFresh() {
    return state.speedMode==='live' && Number.isFinite(state.gpsSpeedKnots) &&
      performance.now()-state.gpsSpeedLastFixAt<GPS_STALE_MS;
  }
  function currentSpeed() {
    return state.speedMode==='sim'?SIM_IAS_KT:speedFresh()?state.gpsSpeedDisplayKnots:null;
  }
  function updateSpeedInfo() {
    const btn=el('speedMode');
    btn.textContent=state.speedMode==='live'?'SPD: GPS':'SPD: SIM';
    btn.setAttribute('aria-pressed', state.speedMode==='live'?'true':'false');
    btn.classList.toggle('selected',state.speedMode==='live');
    if(state.speedMode==='sim') {
      el('speedInfo').textContent='SIMULATED IAS 240 KT · TAP FOR GPS GROUND SPEED';
    } else if(speedFresh()) {
      const acc=Number.isFinite(state.gpsSpeedAccuracyKnots)?'  ±'+Math.round(state.gpsSpeedAccuracyKnots)+' KT':'';
      el('speedInfo').textContent='LIVE GPS GS '+Math.round(state.gpsSpeedKnots)+' KT'+acc;
    } else {
      el('speedInfo').textContent='GPS SPEED: '+(state.gpsSpeedStatus||'WAITING FOR SATELLITES')+' · NO FIX';
    }
  }
  el('speedMode').addEventListener('click', () => {
    state.speedMode=state.speedMode==='sim'?'live':'sim';
    state.gpsSpeedKnots=null; state.gpsSpeedDisplayKnots=null;
    state.gpsSpeedAccuracyKnots=null;state.gpsSpeedLastFixAt=0;
    state.gpsSpeedStatus=state.speedMode==='live'?'WAITING FOR PRECISE LOCATION / SATELLITES':'GPS OFF';
    updateSpeedInfo();
    syncGeolocation();
  });
  window.receiveNativeSpeed = (metersPerSecond,accuracyMetersPerSecond) => {
    if(state.speedMode!=='live' || !Number.isFinite(metersPerSecond) || metersPerSecond<0 || metersPerSecond>500) return;
    const knots=metersPerSecond*KNOTS_PER_MPS;
    state.gpsSpeedKnots=knots;
    if(!Number.isFinite(state.gpsSpeedDisplayKnots)) state.gpsSpeedDisplayKnots=knots;
    state.gpsSpeedAccuracyKnots=Number.isFinite(accuracyMetersPerSecond)&&accuracyMetersPerSecond>=0?accuracyMetersPerSecond*KNOTS_PER_MPS:null;
    state.gpsSpeedLastFixAt=performance.now();
    state.gpsSpeedStatus='GPS RECEIVING';
    updateSpeedInfo();
  };
  window.nativeSpeedStatus=message=>{
    if(state.speedMode!=='live')return;
    state.gpsSpeedStatus=String(message).slice(0,120);
    updateSpeedInfo();
  };
  setInterval(updateSpeedInfo,1000);
  updateSpeedInfo();
  function updateGpsInfo() {
    const btn=el('altMode');
    btn.textContent=state.altMode==='live'?'ALT: GPS':'ALT: SIM';
    btn.setAttribute('aria-pressed',state.altMode==='live'?'true':'false');
    btn.classList.toggle('selected',state.altMode==='live');
    if(state.altMode==='sim') {
      el('gpsInfo').textContent='SIMULATED ALTITUDE 4,300 FT · TAP FOR LIVE GPS';
    } else if(gpsFresh()) {
      const acc=Number.isFinite(state.gpsAccuracyFeet)?'  ±'+Math.round(state.gpsAccuracyFeet)+' FT':'';
      el('gpsInfo').textContent='LIVE '+state.gpsDatum+'  '+Math.round(state.gpsAltitudeFeet).toLocaleString('en-US')+' FT'+acc;
    } else {
      el('gpsInfo').textContent='GPS: '+(state.gpsStatus||'WAITING FOR SATELLITES')+' · NO FIX';
    }
  }
  el('altMode').addEventListener('click', () => {
    state.altMode=state.altMode==='sim'?'live':'sim';
    state.gpsAltitudeFeet=null; state.gpsDisplayFeet=null; state.gpsLastFixAt=0;
    state.gpsStatus=state.altMode==='live'?'WAITING FOR PRECISE LOCATION PERMISSION / SATELLITES':'GPS OFF';
    updateGpsInfo();
    syncGeolocation();
  });
  // Receives only altitude/quality/datum; latitude and longitude are never stored or sent to HTML.
  window.receiveNativeGps=(meters,accuracyMeters,datum)=>{
    if(state.altMode!=='live'||!Number.isFinite(meters))return;
    if(datum!=='MSL' && datum!=='WGS84') return;
    const feet=meters*FT_PER_M;
    if(!Number.isFinite(feet)||Math.abs(feet)>328084)return;
    state.gpsAltitudeFeet=feet;
    if(!Number.isFinite(state.gpsDisplayFeet)) state.gpsDisplayFeet=feet;
    state.gpsDatum=datum;
    state.gpsAccuracyFeet=Number.isFinite(accuracyMeters)&&accuracyMeters>=0?accuracyMeters*FT_PER_M:null;
    state.gpsLastFixAt=performance.now();
    state.gpsStatus='GPS RECEIVING';

    poly(isSpeed?[[x+w-3,cy-9],[x+w+10,cy],[x+w-3,cy+9]]:[[x+3,cy-9],[x-10,cy],[x+3,cy+9]],'#f9fbff','#f9fbff');
    const readout=hasNumber?String(Math.round(value)):'----';
    txt(readout,cx,cy,isSpeed?(wide?30:28):readout.length>5?(wide?24:21):(wide?30:28),'#fefefe','center',true);
    const label=isSpeed?(state.speedMode==='sim'?'IAS / KT':'GPS GS / KT'):state.altMode==='sim'?'SIM ALT / FT':'GPS '+(gpsFresh()?state.gpsDatum:'ALT')+' / FT';
    txt(label,cx,y-16,wide?17:15,isSpeed?'#9de28e':state.altMode==='sim'?'#e2bf80':'#8be4d4','center',true);
    let foot;
    if(isSpeed)foot=state.speedMode==='sim'?'DEMO 240':!speedFresh()?'NO SPEED FIX':Number.isFinite(state.gpsSpeedAccuracyKnots)?'±'+Math.round(state.gpsSpeedAccuracyKnots)+' KT':'ACC —';
    else if(state.altMode==='sim')foot='DEMO 4300';
    else if(!gpsFresh())foot='NO GPS FIX';
    else foot=Number.isFinite(state.gpsAccuracyFeet)?'±'+Math.round(state.gpsAccuracyFeet)+' FT':'ACC —';
    txt(foot,cx,y+h+20,wide?17:15,'#e4f0f5','center');
  }
  function drawCompass(cx,cy,r,wide) {
    const col='#e4f4ff';
    const heading=Number.isFinite(state.heading)?state.heading:0;
    const headingText=Number.isFinite(state.heading)?String(Math.round(heading)%360).padStart(3,'0'):'---';
    ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();
    ctx.strokeStyle='#8cbdc4';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(cx,cy,r-3,0,Math.PI*2);ctx.stroke();
    for(let h=0;h<360;h+=5) {
      const a=(h-heading)*rad;
      const v=h%30===0, big=h%10===0;
      const r1=r-(v?23:big?14:9),r2=r-3;
      line(cx+Math.sin(a)*r1,cy-Math.cos(a)*r1,cx+Math.sin(a)*r2,cy-Math.cos(a)*r2,col,big?2:1);
      if(v) {
        const lab= h===0?'N':h===90?'E':h===180?'S':h===270?'W':String(h/10).padStart(2,'0');
        // Cardinal directions are larger and brighter; numeric headings retain their size.
        if(h%90!==0) txt(lab,cx+Math.sin(a)*(r-43),cy-Math.cos(a)*(r-43),wide?17:18,col,'center',true);
      }
    }
    line(cx-r*.53,cy,cx+r*.53,cy,'#78daeb',2);
    line(cx,cy-r*.53,cx,cy+r*.53,'#78daeb',2);
    poly([[cx,cy-r*.64],[cx-9,cy-r*.53],[cx+9,cy-r*.53]],'#e3f6ff');
    // Magenta course deviation graphics are demonstration only.
    line(cx-4,cy+r*.3,cx-4,cy-r*.24,'#ee4ddb',3);
    poly([[cx,cy-r*.43],[cx-11,cy-r*.25],[cx+11,cy-r*.25]],'#ed6add');
    for(const [h,lab] of [[0,'N'],[90,'E'],[180,'S'],[270,'W']]) {
      const a=(h-heading)*rad, labelR=r-43;
      txt(lab,cx+Math.sin(a)*labelR,cy-Math.cos(a)*labelR,h===0?34:30,h===0?'#ffe079':'#ffffff','center',true);
    }
    ctx.restore();
    rect(cx-43,cy-r-17,86,29,'#03070d','#f1f7fa',1.5);
    txt(headingText,cx,cy-r-2,25,'#eaf9ff','center',true);
    txt(state.headingSource,cx,cy+r+20,wide?13:12,'#9ddcee','center',true);
  }
  function drawPortrait(H) {
    const W=800;
    // Reallocate the vertical space of tall portrait screens rather than letterboxing.
    const extra=Math.max(0,H-1260);
    const r=193+Math.min(27,extra*.12);
    const a={x:132,y:95,w:536,h:650+extra-2*(r-193)};
    const bankY=a.y+a.h+30, dividerY=bankY+18;
    const ccx=400, ccy=dividerY+26+r, navY=ccy-90;
    rect(0,0,W,H,'#020608');
    line(22,39,778,39,'#3b4c56',2);
    txt('LJ45 / HONEYWELL PRIMUS-STYLE',32,19,17,'#a7c6d3','left',true);
    txt('SIMULATED PFD',768,19,16,'#e2c87a','right',true);
    const annunciations=[['LOC',125],['HDG',270],[state.speedMode==='live'?'GPS GS':'IAS',405],['GS',543],['AP',655]];
    annunciations.forEach(([label,x])=>txt(label,x,64,20,label==='AP'?'#9de28e':'#8adf89','center',true));
    drawAttitude(a,displayBank(),state.pitch,false);
    drawTape(14,a.y+52,110,a.h-107,'speed',false);
    drawTape(676,a.y+52,110,a.h-107,'alt',false);
    txt('BANK',245,bankY,17,'#b1c2d0','left',true);
    txt((displayBank()>=0?'+':'')+displayBank().toFixed(1)+'°',340,bankY,19,'#f8d76d','left',true);
    txt('PITCH',462,bankY,17,'#b1c2d0','left',true);
    txt((state.pitch>=0?'+':'')+state.pitch.toFixed(1)+'°',561,bankY,19,'#f8d76d','left',true);
    line(20,dividerY,780,dividerY,'#72848b',2);
    drawCompass(ccx,ccy,r,false);
    txt('359 CRS',25,navY,21,'#e4f2f8','left',true);
    txt('ILS 1',25,navY+36,20,'#a6e79d','left',true);
    txt('13.1 NM',25,navY+73,22,'#e9f5ff','left',true);
    txt('HDG '+(Number.isFinite(state.heading)?String(Math.round(state.heading)%360).padStart(3,'0'):'---'),767,navY,21,'#c1aaff','right',true);
    txt('VOR1',762,navY+41,21,'#e9f4fb','right');
    txt(state.altMode==='live'||state.speedMode==='live'?'GPS DATA':'DEMO DATA',763,navY+78,18,'#bbaa80','right',true);
  }
  function drawLandscape() {
    const W=1230,H=725;
    rect(0,0,W,H,'#020608');
    txt('LJ45   PRIMUS 1000   •   SIMULATION',22,24,17,'#b4c9d2','left',true);
    [['LOC',355],['HDG',480],[state.speedMode==='live'?'GPS GS':'IAS',622],['GS',760],['AP',885]].forEach(([v,x])=>txt(v,x,55,20,'#93df8c','center',true));
    const a={x:245,y:88,w:740,h:543};
    drawAttitude(a,displayBank(),state.pitch,true);
    drawTape(34,125,196,466,'speed',true);
    drawTape(999,125,196,466,'alt',true);
    txt('PITCH '+(state.pitch>=0?'+':'')+state.pitch.toFixed(1)+'°',350,676,21,'#fbd974','center',true);
    txt('BANK '+(displayBank()>=0?'+':'')+displayBank().toFixed(1)+'°',606,676,21,'#fbd974','center',true);
    txt('HDG '+(Number.isFinite(state.heading)?String(Math.round(state.heading)%360).padStart(3,'0'):'---'),880,676,21,'#cbecfc','center',true);
    line(24,704,1206,704,'#536875',1);
    txt((state.altMode==='live'?'GPS ALT · ':'')+(state.speedMode==='live'?'GPS GS · ':'')+'HEADING LIVE · OTHER AIR/NAV DATA SIMULATED',615,715,12,'#7997a8','center');
  }
  let width=0,height=0,dpr=1;
  function resize(){
    const bounds=canvas.getBoundingClientRect();
    width=Math.max(1,bounds.width);height=Math.max(1,bounds.height);
    dpr=Math.min(window.devicePixelRatio||1,2.5);
    const cw=Math.round(width*dpr),ch=Math.round(height*dpr);
    if(canvas.width!==cw||canvas.height!==ch){canvas.width=cw;canvas.height=ch;}
  }
  const ro=typeof ResizeObserver!=='undefined'?new ResizeObserver(resize):null;
  if(ro)ro.observe(canvas);
  window.addEventListener('resize',()=>{resize();syncScreenReference();});
  window.addEventListener('orientationchange',()=>{resize();syncScreenReference();});
  if (screen.orientation && typeof screen.orientation.addEventListener==='function')
    screen.orientation.addEventListener('change',syncScreenReference);
  resize();
  let prev=performance.now();
  function render(now) {
    syncScreenReference();
    const elapsed=clamp((now-prev)/1000,0,.1);prev=now;
    const smooth=1-Math.exp(-elapsed*12);
    state.bank+=wrap(state.targetBank-state.bank)*smooth;
    state.pitch+=(state.targetPitch-state.pitch)*smooth;
    if(Math.abs(state.bank)<.004)state.bank=0;
    if(Math.abs(state.pitch)<.004)state.pitch=0;
    refreshBankSound();
    if(gpsFresh()) {
      if(!Number.isFinite(state.gpsDisplayFeet))state.gpsDisplayFeet=state.gpsAltitudeFeet;
      else state.gpsDisplayFeet+=(state.gpsAltitudeFeet-state.gpsDisplayFeet)*(1-Math.exp(-elapsed*2.4));
    }
    if(speedFresh()) {
      if(!Number.isFinite(state.gpsSpeedDisplayKnots))state.gpsSpeedDisplayKnots=state.gpsSpeedKnots;
      else state.gpsSpeedDisplayKnots+=(state.gpsSpeedKnots-state.gpsSpeedDisplayKnots)*(1-Math.exp(-elapsed*2.4));
    }
    // Choose the PFD presentation from the PHONE orientation, not the remaining canvas
    // shape (which can be wide in portrait when the controls take up vertical space).
    const wide=window.innerWidth > window.innerHeight;
    const designW=wide?1230:800,designH=wide?725:Math.max(1260,800*height/Math.max(1,width));
    const factor=Math.min(width/designW,height/designH);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle='#020608';ctx.fillRect(0,0,width,height);
    ctx.translate((width-designW*factor)/2,(height-designH*factor)/2);
    ctx.scale(factor,factor);
    if(wide)drawLandscape();else drawPortrait(designH);
    requestAnimationFrame(render);
  }
  requestAnimationFrame(render);
  setStatus('TAP SENSORS');
  el('bankNotice').textContent='ALERT >35° / CLEAR <32° · TAP SENSORS TO ARM';
  updateDiagnostics();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol==='https:') {
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
